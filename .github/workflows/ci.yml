name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build application
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan Git history for secrets
        env:
          GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          docker pull "$GITLEAKS_IMAGE"

          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            --volume "$GITHUB_WORKSPACE/.git:/repo/.git:ro" \
            --workdir /repo \
            "$GITLEAKS_IMAGE" \
            git /repo \
            --log-opts="--all" \
            --redact=100 \
            --verbose      

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          python -m pip install -r app/requirements-security.txt
          python -m pip check

      - name: Scan Python code with Bandit
        run: |
          python -m bandit \
            -r app/src app/scripts \
            --severity-level all \
            --confidence-level all

      - name: Audit Python dependencies
        run: |
          python -m pip_audit \
            --strict \
            -r app/requirements-dev.txt \
            -r app/requirements-cli.txt \
            -r app/requirements-security.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Audit JavaScript dependencies
        working-directory: app/frontend
        run: |
          npm audit \
            --package-lock-only \
            --include=dev \
            --audit-level=low

      - name: Install test dependencies
        run: |
          python -m pip install -r app/requirements-dev.txt
          python -m pip check

      - name: Run tests without external services
        env:
          PYTHONPATH: app/src:app/scripts
        run: |
          for suite in \
            test_domain.py \
            test_health.py \
            test_readiness.py \
            test_authentication.py \
            test_routes.py \
            test_id_token.py
          do
            python -m unittest discover \
              -s app/tests -p "$suite" -v
          done

      - name: Build application image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag homelab-promotion:ci \
            --file app/Dockerfile \
            app

      - name: Start application container
        run: |
          docker run --detach \
            --name promotion-ci \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:8000:8000 \
            homelab-promotion:ci

      - name: Check container HTTP endpoints
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 1 \
            --retry-connrefused --retry-all-errors \
            --retry-max-time 60 --max-time 3 \
            http://127.0.0.1:8000/healthz \
            --output /tmp/promotion-health.json

          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen

          health = json.loads(
              Path("/tmp/promotion-health.json").read_text()
          )
          if health != {"status": "ok"}:
              raise SystemExit("Unexpected liveness response.")

          with urlopen("http://127.0.0.1:8000/", timeout=5) as response:
              html = response.read().decode("utf-8")
              if response.headers.get_content_type() != "text/html":
                  raise SystemExit("Frontend did not return HTML.")
              if 'type="module"' not in html or "/assets/" not in html:
                  raise SystemExit("Compiled frontend references are missing.")

          try:
              urlopen("http://127.0.0.1:8000/me", timeout=5)
          except HTTPError as error:
              if error.code != 401:
                  raise SystemExit(f"Expected HTTP 401, got {error.code}.")
              if error.headers.get("WWW-Authenticate") != "Bearer":
                  raise SystemExit("Bearer challenge is missing.")
          else:
              raise SystemExit("Unauthenticated identity request was accepted.")

          print("Container HTTP checks passed.")
          PY

      - name: Verify container security restrictions
        run: |
          python - <<'PY'
          import json
          import subprocess

          container = json.loads(subprocess.check_output(
              ["docker", "inspect", "promotion-ci"],
              text=True,
          ))[0]

          config = container["Config"]
          host = container["HostConfig"]

          checks = {
              "non-root user": config["User"] == "10001:10001",
              "not privileged": host["Privileged"] is False,
              "read-only filesystem": host["ReadonlyRootfs"] is True,
              "all capabilities dropped": "ALL" in (host["CapDrop"] or []),
              "no added capabilities": not host["CapAdd"],
              "no new privileges": any(
                  option in ("no-new-privileges", "no-new-privileges:true")
                  for option in (host["SecurityOpt"] or [])
              ),
          }

          status_text = subprocess.check_output(
              ["docker", "exec", "promotion-ci", "cat", "/proc/1/status"],
              text=True,
          )
          status = dict(
              line.split(":", 1)
              for line in status_text.splitlines()
              if ":" in line
          )

          checks["process UID"] = status["Uid"].split() == ["10001"] * 4
          checks["process GID"] = status["Gid"].split() == ["10001"] * 4
          checks["process NoNewPrivs"] = status["NoNewPrivs"].strip() == "1"

          for field in ("CapInh", "CapPrm", "CapEff", "CapBnd", "CapAmb"):
              checks[field] = int(status[field].strip(), 16) == 0

          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit(
                  "Container security checks failed: " + ", ".join(failed)
              )

          print("Container security restrictions verified.")
          PY

      - name: Scan application image
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
        run: |
          scan_dir="$(mktemp -d "$RUNNER_TEMP/image-scan.XXXXXX")"
          mkdir -p "$scan_dir/cache"

          docker image save \
            --output "$scan_dir/promotion.tar" \
            homelab-promotion:ci

          docker pull "$TRIVY_IMAGE"

          trivy_image() {
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --volume "$scan_dir:/scan:ro" \
              --volume "$scan_dir/cache:/cache" \
              --volume "$GITHUB_WORKSPACE/app/.trivyignore.yaml:/policy/ignore.yaml:ro" \
              "$TRIVY_IMAGE" \
              image \
              --input /scan/promotion.tar \
              --cache-dir /cache \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --timeout 10m \
              "$@"
          }

          echo "Unfiltered HIGH and CRITICAL findings"
          trivy_image \
            --ignorefile /dev/null \
            --exit-code 0

          echo "Enforcing the time-limited exception policy"
          trivy_image \
            --skip-db-update \
            --ignorefile /policy/ignore.yaml \
            --show-suppressed \
            --exit-code 1

      - name: Publish application image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_ref="$image_name:sha-$GITHUB_SHA"

          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/ghcr-auth.XXXXXX")"
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

          docker tag homelab-promotion:ci "$image_ref"
          docker push "$image_ref"

          echo "Published image: $image_ref"
          docker image inspect "$image_ref" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}'

      - name: Show container logs on failure
        if: failure()
        run: |
          if docker container inspect promotion-ci >/dev/null 2>&1; then
            docker logs promotion-ci
          fi

      - name: Remove test container
        if: always()
        run: |
          if docker container inspect promotion-ci >/dev/null 2>&1; then
            docker rm --force promotion-ci
          fi
