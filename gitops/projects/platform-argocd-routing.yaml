apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-argocd-routing
  namespace: argocd
spec:
  description: Manage HTTP routes for the Argo CD UI.
  sourceRepos:
    - https://github.com/abdelhaouari/homelab-v2.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
