apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-https
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: ingress-system
      sectionName: https-argocd
  hostnames:
    - argocd.lab.ahaouari.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-http-redirect
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: ingress-system
      sectionName: http
  hostnames:
    - argocd.lab.ahaouari.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
