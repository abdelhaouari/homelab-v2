apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-staging
spec:
  secretName: argocd-staging-tls
  dnsNames:
    - argocd.lab.ahaouari.com
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
