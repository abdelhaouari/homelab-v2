apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rexpn
spec:
  secretName: rexpn-tls
  dnsNames:
    - rexpn.lab.ahaouari.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
