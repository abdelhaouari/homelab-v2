apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: "10.10.20.103"
  infrastructure:
    labels:
      networking.ahaouari.com/exposure: lan-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
        kinds:
          - kind: HTTPRoute
    - name: https-argocd
      protocol: HTTPS
      port: 443
      hostname: argocd.lab.ahaouari.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: argocd-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
        kinds:
          - kind: HTTPRoute
