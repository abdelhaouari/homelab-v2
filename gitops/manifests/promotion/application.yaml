apiVersion: v1
kind: Service
metadata:
  name: promotion-api
spec:
  selector:
    app.kubernetes.io/name: promotion-api
    app.kubernetes.io/part-of: promotion
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: promotion-api
      app.kubernetes.io/part-of: promotion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promotion-api
        app.kubernetes.io/part-of: promotion
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: ghcr.io/abdelhaouari/homelab-v2@sha256:d7c2b4436360b6ee92daac5683873d4114054359310800923cc9fbe2de022a87
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PROMOTION_DB_HOST
              value: postgres
            - name: PROMOTION_DB_PORT
              value: "5432"
            - name: PROMOTION_DB_NAME
              value: promotion
            - name: PROMOTION_DB_USER
              value: promotion_app
            - name: PROMOTION_DB_PASSWORD_FILE
              value: /run/secrets/database/password
            - name: PROMOTION_OIDC_ISSUER
              value: http://localhost:8080/realms/homelab
            - name: PROMOTION_OIDC_JWKS_URL
              value: http://keycloak:8080/realms/homelab/protocol/openid-connect/certs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: credentials
              mountPath: /run/secrets/database
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: promotion-database
            defaultMode: 0440
