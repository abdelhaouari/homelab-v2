# Helm chart: argo/argo-cd 10.11.6
# Application: Argo CD v3.5.6
# Single-replica homelab installation.
# TLS terminates at the shared Gateway; backend traffic uses HTTP.

controller:
  replicas: 1

server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false

repoServer:
  replicas: 1

redis-ha:
  enabled: false

redis:
  enabled: true

dex:
  enabled: false

applicationSet:
  replicas: 0

notifications:
  enabled: false

configs:
  cm:
    url: https://argocd.lab.ahaouari.com
  params:
    server.insecure: true
