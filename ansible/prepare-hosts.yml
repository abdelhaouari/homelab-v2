---
- name: Prepare operating system for Kubernetes
  hosts: kubernetes
  become: true

  tasks:
    - name: Disable swap entries in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([ \t]*[^#\s]+\s+\S+\s+swap\s+.*)$'
        replace: '# Disabled for Kubernetes: \1'
        backup: true

    - name: Inspect active swap
      ansible.builtin.command: swapon --show --noheadings
      register: active_swap
      changed_when: false

    - name: Disable active swap
      ansible.builtin.command: swapoff --all
      when: active_swap.stdout | trim | length > 0
      changed_when: true

    - name: Persist IPv4 forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.ipv4.ip_forward = 1

    - name: Inspect current IPv4 forwarding
      ansible.builtin.command: sysctl -n net.ipv4.ip_forward
      register: ipv4_forwarding
      changed_when: false

    - name: Enable IPv4 forwarding immediately
      ansible.builtin.command: sysctl -w net.ipv4.ip_forward=1
      when: ipv4_forwarding.stdout | trim != "1"
      changed_when: true

    - name: Verify swap is disabled
      ansible.builtin.command: swapon --show --noheadings
      register: swap_verification
      changed_when: false
      failed_when: swap_verification.stdout | trim | length > 0

    - name: Verify IPv4 forwarding is enabled
      ansible.builtin.command: sysctl -n net.ipv4.ip_forward
      register: forwarding_verification
      changed_when: false
      failed_when: forwarding_verification.stdout | trim != "1"
