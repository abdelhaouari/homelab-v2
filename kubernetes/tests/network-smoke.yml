---
apiVersion: v1
kind: Namespace
metadata:
  name: network-smoke

---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: network-smoke
  labels:
    app: network-smoke-server
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker01
  containers:
    - name: http
      image: busybox:1.37.0
      command:
        - sh
        - -ec
        - |
          mkdir -p /www
          printf 'homelab-network-ok\n' > /www/index.html
          exec httpd -f -p 8080 -h /www
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 1
        periodSeconds: 2

---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: network-smoke
spec:
  selector:
    app: network-smoke-server
  ports:
    - port: 80
      targetPort: 8080

---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: network-smoke
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker02
  containers:
    - name: client
      image: busybox:1.37.0
      command: ["sleep", "86400"]
