# Use the per-node PodCIDRs allocated by Kubernetes.
ipam:
  mode: kubernetes

# Carry inter-node pod traffic over VXLAN.
routingMode: tunnel
tunnelProtocol: vxlan

# Replace kube-proxy with Cilium's eBPF service handling.
kubeProxyReplacement: true

# Reach the API directly, independently of Kubernetes Services.
k8sServiceHost: "10.10.20.11"
k8sServicePort: 6443

ipv4:
  enabled: true

ipv6:
  enabled: false

operator:
  replicas: 2

# Generate and renew Hubble certificates inside the cluster.
hubble:
  tls:
    auto:
      enabled: true
      method: cronJob

# Reconcile Kubernetes Gateway API resources.
gatewayAPI:
  enabled: true

# Enable LAN announcements; a separate policy selects eligible Services.
l2announcements:
  enabled: true

# Allow headroom for API requests, including L2 lease renewals.
k8sClientRateLimit:
  qps: 20
  burst: 40
