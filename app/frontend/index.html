<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promotion requests</title>
  </head>
  <body>
    <main>
      <h1>Promotion requests</h1>
      <p id="status" role="status" aria-live="polite">Initializing...</p>

      <button id="login" type="button" disabled>Sign in</button>
      <button id="logout" type="button" hidden>Sign out</button>

      <section id="identity" hidden>
        <h2>Current identity</h2>
        <dl>
          <dt>Subject</dt>
          <dd id="subject"></dd>
          <dt>Roles</dt>
          <dd id="roles"></dd>
        </dl>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
