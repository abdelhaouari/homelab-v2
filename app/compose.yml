name: homelab-promotion

services:
  postgres:
    image: postgres:18.6-bookworm

    environment:
      POSTGRES_DB: promotion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    secrets:
      - postgres_password

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d promotion"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1

    command:
      - start-dev
      - --db=dev-file
      - --hostname=http://localhost:8080
      - --import-realm

    env_file:
      - path: ../private/keycloak-admin.env
        format: raw

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro

  app:
    image: homelab-promotion:local
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      PROMOTION_DB_HOST: postgres
      PROMOTION_DB_PORT: "5432"
      PROMOTION_DB_NAME: promotion
      PROMOTION_DB_USER: promotion_app
      PROMOTION_DB_PASSWORD_FILE: /run/secrets/promotion_app_password
      PROMOTION_OIDC_ISSUER: http://localhost:8080/realms/homelab
      PROMOTION_OIDC_JWKS_URL: http://keycloak:8080/realms/homelab/protocol/openid-connect/certs

    secrets:
      - promotion_app_password

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ../private/postgres-password.txt
  promotion_app_password:
    file: ../private/promotion-app-password.txt

volumes:
  postgres_data:
  keycloak_data:
