name: homelab-promotion

services:
  postgres:
    image: postgres:18.6-bookworm

    environment:
      POSTGRES_DB: promotion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    secrets:
      - postgres_password

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d promotion"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

secrets:
  postgres_password:
    file: ../private/postgres-password.txt

volumes:
  postgres_data:
